# Edge Function gateway configuration.
#
# `verify_jwt` only decides whether the Supabase gateway demands a valid JWT
# before the handler runs. Every handler still validates its own caller, body
# size and access rights, so a public entry point is never an open door.
#
# Server-only credentials live in Supabase's function secrets, never in this
# repository and never behind a VITE_ prefix; QYANT.md lists what each function
# needs and nothing in this file is a credential value.

# Admin-only: staff account management. The handler additionally re-checks the
# caller's role and refuses privilege escalation.
[functions.admin-users]
verify_jwt = true

# Anonymous by design: public AOH AI chat, rate limited inside the handler.
[functions.assistant]
verify_jwt = false

# Anonymous by design: double opt-in subscribe/confirm/unsubscribe. Tokens are
# hashed and HMAC-signed, and the honeypot plus per-IP throttle limit abuse.
[functions.newsletter]
verify_jwt = false

# Anonymous by design: exact-serial certificate lookup that returns only the
# fields the public register is allowed to expose.
[functions.verify-certificate]
verify_jwt = false

# Anonymous at the gateway because the cron scheduler carries the internal cron
# secret header instead of a user JWT; the handler rejects any request without
# the matching secret or a settings.manage user token.
[functions.send-email]
verify_jwt = false

# Anonymous at the gateway for the same reason; the handler requires its own
# cron secret header, falling back to the shared one and then to the server
# credential Supabase injects.
[functions.send-deadline-reminders]
verify_jwt = false

# Open at the gateway on purpose: the database dispatcher (`_cron_dispatch_push`)
# cannot mint a user JWT, so it presents a DB-only token instead. The handler is
# still closed — it accepts that token, or a signed-in staff session whose role
# it re-checks server-side, and never a REST credential. Turning verify_jwt back on
# here silently breaks every notification push queued by the database.
[functions.onesignal-send]
verify_jwt = false
