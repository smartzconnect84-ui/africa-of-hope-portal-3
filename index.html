    <h1>AFRICA OF HOPE School of Professional Studies — practical certificate programmes in Liberia</h1>
    <p>AFRICA OF HOPE at Boystown Junction, Lower Margibi, Liberia offers practical two-week, one-month, three-month and six-month certificate programmes in trades, technology, business and hospitality for high-school leavers and working adults. Tuition is sponsored — you pay only a registration package of US$5 to US$45. Strictly online students can enrol anytime; on-site cohorts follow the published term calendar. Phone/WhatsApp <a href="tel:+231776679963">+231776679963</a>, email <a href="mailto:afrohope033@gmail.com">afrohope033@gmail.com</a>.</p>
    <h2>Programmes and fees</h2>
    <p>Two-week courses (US$5), one-month courses (US$10), three-month courses (US$30) and six-month courses (US$45), including computer studies, tailoring, catering, electrical work, plumbing, business and more. Fully online study is 1 hour a day, 3 days a week; fully on-site study is 2 hours daily, 2 days a week. See <a href="https://africaofhopelr.org/programmes">Programmes</a> and <a href="https://africaofhopelr.org/admissions">Admissions</a>.</p>
    <h2>How certificate verification works</h2>
    <ol>
      <li>Find the unique serial number printed on the certificate (or scan its QR code).</li>
      <li>Enter the serial number on the <a href="https://africaofhopelr.org/verify">Verify page</a>.</li>
      <li>A valid result shows the holder's name, programme, completion date and status; revoked or unknown serials are reported as not valid.</li>
    </ol>
    <h2>Questions and answers</h2>
    <p><strong>What courses can I study?</strong> Two-week to six-month certificate tracks with online, on-site and blended options.</p>
    <p><strong>How much does it cost?</strong> Registration only: US$5 / US$10 / US$30 / US$45 by track; reserve a seat with half.</p>
    <p><strong>How do admissions work?</strong> Admissions for 2026/2027 are open and online students can enrol anytime — <a href="https://africaofhopelr.org/admissions">apply online</a>.</p>
    <p><strong>Who is it for?</strong> High-school leavers and working adults in Liberia. Degree programmes are not offered.</p>
